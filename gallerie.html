<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FitNix, salle de sport avec coachs certifiés, programmes sur mesure et suivi nutrition. Réservez un essai gratuit et commencez votre transformation.">
    <title>Document</title>
</head>
<body>
    <header>

    </header>
    <main>
        <section id="gallery" class="section-gallery">
            <div class="conteneur-gallery">
                <div class="section-gallery-titre">
                    <h2>FITNIX GALLERIE</h2>
                    <p>La gallerie pour découvrir les espaces, les activités et l'ambiance de notre salle FITNIX</p>   
                </div>
                <div class="images--gallery">
                    <div class="gallery-item">
                        <img alt="Disques de musculation jaunes et rouges sur un rack, dans l’espace poids libres" src="Images/photo-1554344728-77cf90d9ed26 (1).avif">
                    </div>
                    <div class="gallery-item" >
                        <img alt ="Guidon d’un vélo de spinning au premier plan, salle d’entraînement floue en arrière-plan" src="Images/photo-1434682772747-f16d3ea162c3.avif">
                    </div>
                    <div class="gallery-item" >
                        <img alt ="Banc de lombaires et machines de musculation dans une salle aux murs orange" src="Images/photo-1434682881908-b43d0467b798.avif">
                    </div>  
                    <div class="gallery-item" >
                        <img alt ="Sportive s’entraînant sur une machine de musculation des jambes, dans une salle moderne" src="Images/photo-1574680088814-c9e8a10d8a4d.avif">
                    </div>
                    <div class="gallery-item" >
                        <img alt="Console et poignées d’une machine de cardio, avec d’autres appareils en arrière-plan" src="Images/photo-1605296867304-46d5465a13f1.avif">
                    </div>
                    <div class="gallery-item" >
                        <img alt ="Sportive faisant des abdominaux sur un banc incliné, tapis de course et grandes baies vitrées derrière elle" src="Images/photo-1605296867724-fa87a8ef53fd.avif">
                    </div>
                </div>
                <div class="carouselle">
                    <div class="carouselle-texte">
                        <h3>les équipements de notre salle FITNIX</h3>
                    </div>
                    <div class="carouselle-container">
                            <div class="wrapper">
                                <div class="container">
                                    <input type="radio" name="slide" id="c1" checked>
                                    <label for="c1" class="card">
                                        <img src="Images/photo-1722925541321-f52d45b29c17.avif" alt="Barres curl" loading="lazy">
                                        <div class="row">
                                            <div class="icon">1</div>
                                            <div class="descrption">
                                                <h4>Barres curl</h4>
                                                <p>Un rack de barres EZ prêtes à l’emploi pour vos exercices de biceps, triceps et avant-bras.</p>
                                            </div>
                                        </div>
                                    </label>
                                    <input type="radio" name="slide" id="c2">
                                    <label for="c2" class="card">
                                        <img src="Images/photo-1734630341082-0fec0e10126c.avif" alt="Haltères" loading="lazy">
                                        <div class="row">
                                            <div class="icon">2</div>
                                            <div class="descrption">
                                                <h4>Haltères</h4>
                                                <p>Une large gamme de poids, des plus légers aux plus lourds, pour tous les niveaux.</p>
                                            </div>
                                        </div>
                                    </label>
                                    <input type="radio" name="slide" id="c3" checked>
                                    <label for="c3" class="card">
                                        <img src="Images/photo-1637430308606-86576d8fef3c.avif" alt="Espace musculation" loading="lazy">
                                        <div class="row">
                                            <div class="icon">3</div>
                                            <div class="descrption">
                                                <h4>Espace musculation</h4>
                                                <p>Bancs réglables, racks et machines dans une ambiance sombre et motivante.</p>
                                            </div>
                                        </div>
                                    </label>
                                    <input type="radio" name="slide" id="c4" checked>
                                    <label for="c4" class="card">
                                        <img src="Images/photo-1605490855119-94921710a47f.avif" alt="Barres et disques" loading="lazy">
                                        <div class="row">
                                            <div class="icon">4</div>
                                            <div class="descrption">
                                                <h4>Barres et disques</h4>
                                                <p>Disques bumper et barres olympiques pour le soulevé de terre, le squat et la force.</p>
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            </div> 
                        </div>
                    </div>    
                </div>        
            </div>
        </section>        
    </main>    
</body>
</html>
