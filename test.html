<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .intro-programmes {
    position: relative;
    overflow: hidden;
    color: white;
    padding: 40px 0;
}

.numero {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 180px;
    font-weight: 900;
    color: #ffffff08;
    z-index: 0;
}

.surtitre,
.intro-programmes h1,
.description,
.btn-programmes {
    position: relative;
    z-index: 1;
}

.surtitre {
    color: #FF6B2C;
    font-weight: bold;
}

.intro-programmes h1 {
    font-size: clamp(38px, 4vw, 64px);
    line-height: 1.1;
    font-weight: 900;
}

.intro-programmes h1 span {
    display: block;
    color: #FF6B2C;
}

.description {
    max-width: 450px;
    color: #aaa;
    line-height: 1.7;
}

.btn-programmes {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 22px;
    background: #FF6B2C;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}
    </style>
</head>
<body>
    <section class="intro-programmes">
    <span class="numero">01</span>

    <p class="surtitre">NOS PROGRAMMES</p>

    <h1>
        ENTRAÎNEZ-VOUS
        <span>À VOTRE FAÇON.</span>
    </h1>

    <p class="description">
        Force, endurance ou remise en forme :
        trouvez le programme adapté à vos objectifs.
    </p>

    <a href="#programmes" class="btn-programmes">
        EXPLORER LES PROGRAMMES →
    </a>
</section>
    
</body>
</html>
